name: Build Iran Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-apk.yml"
      - "iran_game.gd"
      - "iran_icon.svg"
      - "Arcadia_Android_Source_Ready.zip"
      - ".build-trigger"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and repair Android source
        run: |
          test -f Arcadia_Android_Source_Ready.zip
          mkdir -p source
          unzip -q Arcadia_Android_Source_Ready.zip -d source
          PROJECT_FILE="$(find "$GITHUB_WORKSPACE/source" -name project.godot -print -quit)"
          test -n "$PROJECT_FILE"
          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          cp "$GITHUB_WORKSPACE/iran_game.gd" "$PROJECT_DIR/scripts/game.gd"
          mkdir -p "$PROJECT_DIR/assets"
          test -s "$GITHUB_WORKSPACE/iran_icon.svg"
          cp "$GITHUB_WORKSPACE/iran_icon.svg" "$PROJECT_DIR/assets/iran_icon.svg"
          sed -i 's@config/icon=.*@config/icon="res://assets/iran_icon.svg"@' "$PROJECT_DIR/project.godot"
          sed -i 's@application/icon=.*@application/icon="res://assets/iran_icon.svg"@' "$PROJECT_DIR/export_presets.cfg"
          rm -f "$PROJECT_DIR/assets/ending_photo.jpg" "$PROJECT_DIR/assets/ending_photo.jpg.import"
          echo "=== Removed unrelated previous ending photo ==="
          echo "The agreed final image will be added when the original Minions image is available."
          sed -i 's@config/name="آرکادیا"@config/name="ایران"@' "$PROJECT_DIR/project.godot"
          sed -i 's/package\/name="آرکادیا"/package\/name="ایران"/' "$PROJECT_DIR/export_presets.cfg"
          sed -i 's/package\/unique_name="com.arcadia.realm"/package\/unique_name="com.iran.game"/' "$PROJECT_DIR/export_presets.cfg"
          sed -i 's/^version\/code=.*/version\/code=4/' "$PROJECT_DIR/export_presets.cfg"
          sed -i 's/^version\/name=.*/version\/name="1.2.0"/' "$PROJECT_DIR/export_presets.cfg"
          sed -i 's@window/size/viewport_width=.*@window/size/viewport_width=720@' "$PROJECT_DIR/project.godot"
          sed -i 's@window/size/viewport_height=.*@window/size/viewport_height=1280@' "$PROJECT_DIR/project.godot"
          sed -i 's@window/size/window_width_override=.*@window/size/window_width_override=720@' "$PROJECT_DIR/project.godot"
          sed -i 's@window/size/window_height_override=.*@window/size/window_height_override=1280@' "$PROJECT_DIR/project.godot"
          sed -i 's@window/handheld/orientation=.*@window/handheld/orientation=1@' "$PROJECT_DIR/project.godot"
          sed -i 's@node name="Arcadia"@node name="Iran"@' "$PROJECT_DIR/scenes/main.tscn"
          echo "=== Portrait fullscreen project settings ==="
          grep -nE 'viewport_(width|height)|orientation|config/icon' "$PROJECT_DIR/project.godot"
          echo "=== Enable Android ETC2/ASTC texture import ==="
          if grep -q 'textures/vram_compression/import_etc2_astc=' "$PROJECT_DIR/project.godot"; then
            sed -i 's@textures/vram_compression/import_etc2_astc=.*@textures/vram_compression/import_etc2_astc=true@' "$PROJECT_DIR/project.godot"
          elif grep -q '^\[rendering\]$' "$PROJECT_DIR/project.godot"; then
            sed -i '/^\[rendering\]$/a textures/vram_compression/import_etc2_astc=true' "$PROJECT_DIR/project.godot"
          else
            printf '\n[rendering]\ntextures/vram_compression/import_etc2_astc=true\n' >> "$PROJECT_DIR/project.godot"
          fi
          grep -n 'import_etc2_astc' "$PROJECT_DIR/project.godot"
          echo "=== Project script loaded ==="
          wc -l "$PROJECT_DIR/scripts/game.gd"
          echo "=== Export preset ==="
          test -f "$PROJECT_DIR/export_presets.cfg"
          grep -nE '^\[preset|^name=|^platform=|target_sdk|version/code' "$PROJECT_DIR/export_presets.cfg" || true
          echo "=== Godot version ==="
          godot --version

      - name: Install Java and Android export prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends openjdk-17-jdk-headless unzip python3
          export JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          export ANDROID_HOME=/usr/lib/android-sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/23.2.8568313"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          export PATH="$JAVA_HOME/bin:$ANDROID_HOME/cmdline-tools/cmdline-tools/bin:$ANDROID_HOME/platform-tools:$PATH"
          SDKMANAGER="$(command -v sdkmanager || find "$ANDROID_HOME" -name sdkmanager -type f -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-33" "platforms;android-35" "build-tools;33.0.2" "build-tools;34.0.0" "build-tools;35.0.0" "build-tools;35.0.1" "ndk;23.2.8568313" "ndk;28.1.13356709"
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -validity 10000 -keyalg RSA -keysize 2048 -noprompt
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/23.2.8568313" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/23.2.8568313" >> "$GITHUB_ENV"
          echo "PATH=$JAVA_HOME/bin:$ANDROID_HOME/cmdline-tools/cmdline-tools/bin:$ANDROID_HOME/platform-tools:$PATH" >> "$GITHUB_ENV"
          java -version
          "$SDKMANAGER" --list_installed | head -40

      - name: Install Godot 4.4.1 export templates
        run: |
          python3 - <<'PY'
          import urllib.request
          url = "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz"
          urllib.request.urlretrieve(url, "/tmp/godot-templates.tpz")
          PY
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.4.1.stable"
          mkdir -p "$TEMPLATE_DIR"
          unzip -q -o /tmp/godot-templates.tpz -d "$TEMPLATE_DIR"
          if [ -d "$TEMPLATE_DIR/templates" ]; then
            cp -a "$TEMPLATE_DIR/templates/." "$TEMPLATE_DIR/"
            rm -rf "$TEMPLATE_DIR/templates"
          fi
          test -s "$TEMPLATE_DIR/android_debug.apk"
          test -s "$TEMPLATE_DIR/android_release.apk"
          ls -lh "$TEMPLATE_DIR/android_debug.apk" "$TEMPLATE_DIR/android_release.apk"
          echo "=== Android build-template files ==="
          ls -lh "$TEMPLATE_DIR" | grep -E 'android|source' || true
          if grep -q 'gradle_build/use_gradle_build=true' "$PROJECT_DIR/export_presets.cfg"; then
            test -s "$TEMPLATE_DIR/android_source.zip"
            mkdir -p "$PROJECT_DIR/android/build"
            unzip -q -o "$TEMPLATE_DIR/android_source.zip" -d "$PROJECT_DIR/android/build"
          fi
          echo "=== Android export preset (sensitive values removed) ==="
          grep -v -Ei 'password|keystore.*user|keystore.*pass' "$PROJECT_DIR/export_presets.cfg"
          echo "=== SDK build-tools and platform folders ==="
          ls -1 "$ANDROID_HOME/build-tools" || true
          ls -1 "$ANDROID_HOME/platforms" || true
          echo "=== Installed NDK versions ==="
          ls -1 "$ANDROID_HOME/ndk" || true
          echo "=== Android toolchain binaries ==="
          for f in "$ANDROID_HOME/platform-tools/adb" "$ANDROID_HOME/build-tools/33.0.2/aapt" "$ANDROID_HOME/build-tools/35.0.0/zipalign" "$ANDROID_HOME/build-tools/35.0.0/apksigner" "$ANDROID_HOME/ndk/23.2.8568313/ndk-build" "$ANDROID_HOME/ndk/28.1.13356709/ndk-build"; do test -x "$f" && echo "OK: $f" || echo "MISSING: $f"; done
          echo "=== Android export settings loaded from Godot config ==="
          cat "$HOME/.config/godot/editor_settings-4.4.tres"
          echo "=== Editor Android settings ==="
          grep -n 'export/android/' "$HOME/.config/godot/editor_settings-4.4.tres" || true
          test -x "$JAVA_HOME/bin/java"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/ndk/23.2.8568313"
          test -s "$HOME/.android/debug.keystore"

      - name: Import project and build APK
        run: |
          sed -i 's/^package\/signed=true$/package\/signed=false/' "$PROJECT_DIR/export_presets.cfg"
          sed -i "s|^custom_template/debug=.*|custom_template/debug=\"$HOME/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk\"|" "$PROJECT_DIR/export_presets.cfg"
          sed -i "s|^custom_template/release=.*|custom_template/release=\"$HOME/.local/share/godot/export_templates/4.4.1.stable/android_release.apk\"|" "$PROJECT_DIR/export_presets.cfg"
          grep -nE '^package/signed=|^custom_template/' "$PROJECT_DIR/export_presets.cfg" || true
          echo "=== Import project and collect diagnostics ==="
          godot --headless --editor --path "$PROJECT_DIR" --import 2>&1 | tee "$GITHUB_WORKSPACE/godot-import.log"
          if grep -E "SCRIPT ERROR: Parse Error|ERROR: Failed to load script" "$GITHUB_WORKSPACE/godot-import.log"; then
            echo "Godot import reported a script parse error."
            exit 1
          fi
          echo "=== Runtime startup smoke test ==="
          godot --headless --path "$PROJECT_DIR" --quit-after 60 2>&1 | tee "$GITHUB_WORKSPACE/godot-runtime.log"
          if grep -E "SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:" "$GITHUB_WORKSPACE/godot-runtime.log"; then
            echo "Godot runtime reported a script or startup error."
            exit 1
          fi
          echo "=== Android export ==="
          godot --headless --verbose --path "$PROJECT_DIR" --export-debug "Android" "$GITHUB_WORKSPACE/Iran-unsigned.apk" 2>&1 | tee "$GITHUB_WORKSPACE/godot-export.log"
          if grep -E "SCRIPT ERROR: Parse Error|ERROR: Failed to load script|Parse Error:" "$GITHUB_WORKSPACE/godot-export.log"; then
            echo "Godot export reported a script parse error."
            exit 1
          fi
          test -s "$GITHUB_WORKSPACE/Iran-unsigned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$GITHUB_WORKSPACE/Iran-unsigned.apk" "$GITHUB_WORKSPACE/Iran-aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$HOME/.android/debug.keystore" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out "$GITHUB_WORKSPACE/Iran.apk" "$GITHUB_WORKSPACE/Iran-aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$GITHUB_WORKSPACE/Iran.apk"
          test -s "$GITHUB_WORKSPACE/Iran.apk"
          ls -lh "$GITHUB_WORKSPACE/Iran.apk"
          file "$GITHUB_WORKSPACE/Iran.apk" || true

      - name: Package project source for review
        run: |
          cd "$PROJECT_DIR"
          zip -qr "$GITHUB_WORKSPACE/Iran-Project-Source.zip" . -x ".godot/*" -x "android/build/*"

      - name: Upload project source
        uses: actions/upload-artifact@v4
        with:
          name: Iran-Android-Source
          path: Iran-Project-Source.zip
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Iran-Android-APK
          path: Iran.apk
          if-no-files-found: error
