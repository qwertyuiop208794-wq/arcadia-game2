name: Build Arcadia Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-apk.yml"
      - ".build-trigger"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Extract Android source
        run: |
          test -f Arcadia_Android_Source_Ready.zip
          mkdir -p source
          unzip -q Arcadia_Android_Source_Ready.zip -d source
          echo "=== Project files ==="
          find source -maxdepth 4 -name project.godot -print
          PROJECT_FILE="$(find "$GITHUB_WORKSPACE/source" -name project.godot -print -quit)"
          test -n "$PROJECT_FILE"
          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "=== Export presets ==="
          test -f "$PROJECT_DIR/export_presets.cfg"
          grep -n 'Android' "$PROJECT_DIR/export_presets.cfg" | head -20
          echo "=== Godot version ==="
          godot --version
      - name: Import project and build APK
        run: |
          godot --headless --editor --path "$PROJECT_DIR" --import
          godot --headless --path "$PROJECT_DIR" --export-debug "Android" "$GITHUB_WORKSPACE/Arcadia-debug.apk"
          test -s "$GITHUB_WORKSPACE/Arcadia-debug.apk"
          ls -lh "$GITHUB_WORKSPACE/Arcadia-debug.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Arcadia-Android-APK
          path: Arcadia-debug.apk
          if-no-files-found: error
